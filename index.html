<!doctype html>
<html lang="en" data-theme="warm-acoustic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alexey Bashilov — guitarist and vocalist. Original songs and carefully chosen covers. 250+ live performances."
    />
    <title>Alexey Bashilov — Guitar · Voice · Live</title>
    <script>
      (function () {
        try {
          var key = 'bashilov-theme'
          var valid = [
            'dark-rock',
            'warm-acoustic',
            'clean-light',
            'soft-golden',
            'mist',
            'sage',
            'ember',
            'mocha',
          ]
          var stored = localStorage.getItem(key)
          var theme = valid.indexOf(stored) !== -1 ? stored : 'warm-acoustic'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'warm-acoustic')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
